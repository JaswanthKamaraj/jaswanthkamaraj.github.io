  <line x1="32" y1="32" x2="18" y2="22" stroke="url(#cyberGrad)" stroke-width="2.5" opacity="0.9"/>
  <line x1="32" y1="32" x2="46" y2="22" stroke="url(#cyberGrad)" stroke-width="2.5" opacity="0.9"/>
  <line x1="32" y1="32" x2="20" y2="44" stroke="url(#cyberGrad)" stroke-width="2.5" opacity="0.9"/>
  <line x1="32" y1="32" x2="44" y2="44" stroke="url(#cyberGrad)" stroke-width="2.5" opacity="0.9"/>

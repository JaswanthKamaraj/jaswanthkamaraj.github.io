<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="700" fill="url(#bgGrad)"/>

  <!-- Ornate Border System -->
  <rect x="25" y="25" width="950" height="650" fill="none" stroke="#0f172a" stroke-width="4"/>
  <rect x="35" y="35" width="930" height="630" fill="none" stroke="#d97706" stroke-width="2"/>
  <rect x="42" y="42" width="916" height="616" fill="none" stroke="#0f172a" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- Corner Ornaments -->
  <g fill="#d97706">
    <!-- Top-Left -->
    <polygon points="45,45 75,45 45,75"/>
    <!-- Top-Right -->
    <polygon points="955,45 925,45 955,75"/>
    <!-- Bottom-Left -->
    <polygon points="45,655 75,655 45,625"/>
    <!-- Bottom-Right -->
    <polygon points="955,655 925,655 955,625"/>
  </g>

  <!-- Header Logos / Title -->
  <g text-anchor="middle">
    <!-- Issuing Org -->
    <text x="500" y="95" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="700" fill="#64748b" letter-spacing="4">
      DEEPLEARNING.AI &amp; STANFORD ONLINE
    </text>

    <!-- Certificate of Completion -->
    <text x="500" y="145" font-family="'Georgia', serif" font-size="36" font-weight="700" fill="#0f172a" letter-spacing="1">
      Certificate of Specialization
    </text>

    <text x="500" y="180" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" fill="#64748b" letter-spacing="1">
      PROUDLY PRESENTED TO
    </text>

    <!-- Recipient Name -->
    <text x="500" y="245" font-family="'Georgia', serif" font-size="44" font-weight="700" fill="#1e3a8a">
      Jaswanth Kamaraj J
    </text>

    <!-- Divider Line under Name -->
    <line x1="300" y1="265" x2="700" y2="265" stroke="url(#goldGrad)" stroke-width="3"/>

    <!-- Course Title & Description -->
    <text x="500" y="315" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" fill="#475569">
      for successfully completing the rigorous online non-credit specialization in
    </text>

    <text x="500" y="360" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="800" fill="#0f172a">
      Machine Learning Specialization
    </text>

    <!-- Detailed Syllabus / Competencies -->
    <text x="500" y="405" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13.5" fill="#334155">
      Supervised Learning (Regression &amp; Classification) • Advanced Learning Algorithms (Neural Networks)
    </text>
    <text x="500" y="428" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13.5" fill="#334155">
      Unsupervised Learning, Recommenders &amp; Reinforcement Learning
    </text>
  </g>

  <!-- Gold Laurel Seal -->
  <g transform="translate(180, 520)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="48" fill="url(#goldGrad)"/>
    <circle cx="0" cy="0" r="42" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="3,2"/>
    <polygon points="0,-36 8,-22 24,-24 14,-10 24,4 8,4 0,20 -8,4 -24,4 -14,-10 -24,-24 -8,-22" fill="#ffffff" opacity="0.3"/>
    <text x="0" y="-8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="800" fill="#78350f" text-anchor="middle" letter-spacing="1">VERIFIED</text>
    <text x="0" y="7" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="800" fill="#78350f" text-anchor="middle">CREDENTIAL</text>
    <text x="0" y="20" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#78350f" text-anchor="middle">★ ★ ★</text>
    <!-- Ribbon tails -->
    <path d="M -18 36 L -24 64 L 0 54 L 24 64 L 18 36 Z" fill="#b45309"/>
  </g>

  <!-- Signatures Section -->
  <g transform="translate(520, 530)">
    <!-- Signature 1 -->
    <g transform="translate(0, 0)">
      <path d="M 0 0 C 25 -20, 40 10, 70 -15 C 90 -5, 110 -25, 130 0 C 140 10, 160 -10, 180 5" fill="none" stroke="#1e3a8a" stroke-width="2.2"/>
      <line x1="-10" y1="18" x2="190" y2="18" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="90" y="34" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">
        Andrew Ng
      </text>
      <text x="90" y="50" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">
        Founder, DeepLearning.AI | Adjunct Professor, Stanford
      </text>
    </g>

    <!-- Signature 2 -->
    <g transform="translate(260, 0)">
      <path d="M 0 -5 C 20 -15, 45 5, 65 -20 C 85 0, 105 -15, 135 -5 C 150 5, 165 -15, 180 0" fill="none" stroke="#1e3a8a" stroke-width="2.2"/>
      <line x1="-10" y1="18" x2="190" y2="18" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="90" y="34" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">
        Eddy Shyu
      </text>
      <text x="90" y="50" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">
        Curriculum Lead, DeepLearning.AI
      </text>
    </g>
  </g>

  <!-- Credential Footer & ID -->
  <g transform="translate(500, 645)" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b">
    <text>
      Credential ID: <tspan fill="#0f172a" font-weight="700">DLAI-ML-8492041</tspan> • Issue Date: <tspan fill="#0f172a" font-weight="700">November 2024</tspan> • Verify: coursera.org/verify/DLAI-ML-8492041
    </text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="50%" stop-color="#0a0f26"/>
      <stop offset="100%" stop-color="#050711"/>
    </linearGradient>

    <!-- Glowing Node Gradients -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0077b6"/>
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9d4edd"/>
      <stop offset="100%" stop-color="#5a189a"/>
    </linearGradient>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#00f0ff"/>
    </marker>
  </defs>

  <!-- Deep Backdrop -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>

  <!-- Matrix / Circuit Subtle Grid Lines -->
  <g stroke="rgba(0,240,255,0.06)" stroke-width="1">
    <line x1="0" y1="50" x2="800" y2="50"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="350" x2="800" y2="350"/>
    <line x1="0" y1="400" x2="800" y2="400"/>

    <line x1="100" y1="0" x2="100" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="700" y1="0" x2="700" y2="450"/>
  </g>

  <!-- Ambient Glow Blobs -->
  <circle cx="200" cy="180" r="140" fill="rgba(0,240,255,0.12)" filter="url(#glowCyan)"/>
  <circle cx="620" cy="220" r="160" fill="rgba(157,78,221,0.14)" filter="url(#glowCyan)"/>

  <!-- LEFT SIDE: Flowchart Diagram Graphic -->
  <!-- Connecting Arrows -->
  <path d="M 190 75 L 190 110" stroke="#00f0ff" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 190 155 L 190 195" stroke="#00f0ff" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 190 255 L 190 295" stroke="#00f0ff" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 270 225 L 320 225 L 320 330 L 260 330" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow)"/>
  <path d="M 190 355 L 190 390" stroke="#00f0ff" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Node 1: Start Pill -->
  <rect x="110" y="38" width="160" height="38" rx="19" fill="url(#greenGrad)" stroke="#34d399" stroke-width="2" filter="url(#glowCyan)"/>
  <text x="190" y="62" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" text-anchor="middle">START: Binary Search</text>

  <!-- Node 2: Input Parallelogram -->
  <polygon points="125,115 265,115 245,155 105,155" fill="#042f2e" stroke="#14b8a6" stroke-width="2"/>
  <text x="185" y="140" fill="#2dd4bf" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" text-anchor="middle">Read Arr[], Key</text>

  <!-- Node 3: Decision Diamond -->
  <polygon points="190,195 260,225 190,255 120,225" fill="url(#amberGrad)" stroke="#f59e0b" stroke-width="2.5" filter="url(#glowAmber)"/>
  <text x="190" y="222" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">arr[mid] == key?</text>
  <text x="190" y="236" fill="#fef08a" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">True / False</text>

  <!-- Node 4: Process Rectangle -->
  <rect x="110" y="295" width="160" height="42" rx="8" fill="url(#purpleGrad)" stroke="#c084fc" stroke-width="2"/>
  <text x="190" y="321" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" text-anchor="middle">mid = (L + R) / 2</text>

  <!-- Node 5: Output Pill -->
  <rect x="110" y="390" width="160" height="38" rx="19" fill="#831843" stroke="#f43f5e" stroke-width="2"/>
  <text x="190" y="414" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" text-anchor="middle">RETURN Index</text>

  <!-- Branch Labels -->
  <text x="200" y="278" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">YES</text>
  <text x="275" y="218" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">NO</text>

  <!-- RIGHT SIDE: Polyglot Code Window Card -->
  <rect x="390" y="45" width="375" height="360" rx="14" fill="rgba(12, 16, 32, 0.92)" stroke="rgba(0,240,255,0.3)" stroke-width="1.5" filter="url(#glowCyan)"/>

  <!-- Code Window Titlebar -->
  <rect x="390" y="45" width="375" height="38" rx="14" fill="rgba(18, 24, 46, 0.95)"/>
  <circle cx="414" cy="64" r="5" fill="#f43f5e"/>
  <circle cx="430" cy="64" r="5" fill="#f59e0b"/>
  <circle cx="446" cy="64" r="5" fill="#10b981"/>
  <text x="470" y="69" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">binary_search.py  (Python • C++ • Java • Rust)</text>

  <!-- Code Syntax Lines -->
  <g font-family="'JetBrains Mono', monospace" font-size="11" line-height="1.6">
    <text x="415" y="112" fill="#64748b">1  <tspan fill="#f72585">def</tspan> <tspan fill="#00f0ff">binary_search</tspan>(arr, target):</text>
    <text x="415" y="136" fill="#64748b">2      left, right = <tspan fill="#f59e0b">0</tspan>, <tspan fill="#38bdf8">len</tspan>(arr) - <tspan fill="#f59e0b">1</tspan></text>
    <text x="415" y="160" fill="#64748b">3      <tspan fill="#f72585">while</tspan> left &lt;= right:</text>
    <text x="415" y="184" fill="#64748b">4          mid = (left + right) // <tspan fill="#f59e0b">2</tspan></text>
    <text x="415" y="208" fill="#64748b">5          <tspan fill="#f72585">if</tspan> arr[mid] == target:</text>
    <text x="415" y="232" fill="#64748b">6              <tspan fill="#f72585">return</tspan> mid <tspan fill="#64748b"># Found!</tspan></text>
    <text x="415" y="256" fill="#64748b">7          <tspan fill="#f72585">elif</tspan> arr[mid] &lt; target:</text>
    <text x="415" y="280" fill="#64748b">8              left = mid + <tspan fill="#f59e0b">1</tspan></text>
    <text x="415" y="304" fill="#64748b">9          <tspan fill="#f72585">else</tspan>:</text>
    <text x="415" y="328" fill="#64748b">10             right = mid - <tspan fill="#f59e0b">1</tspan></text>
    <text x="415" y="352" fill="#64748b">11     <tspan fill="#f72585">return</tspan> -<tspan fill="#f59e0b">1</tspan></text>
  </g>

  <!-- Polyglot Badges at bottom right -->
  <rect x="410" y="368" width="55" height="20" rx="4" fill="rgba(0,240,255,0.15)" stroke="rgba(0,240,255,0.4)"/>
  <text x="437" y="382" fill="#00f0ff" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">PYTHON</text>

  <rect x="472" y="368" width="45" height="20" rx="4" fill="rgba(157,78,221,0.15)" stroke="rgba(157,78,221,0.4)"/>
  <text x="494" y="382" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">C++</text>

  <rect x="524" y="368" width="50" height="20" rx="4" fill="rgba(245,158,11,0.15)" stroke="rgba(245,158,11,0.4)"/>
  <text x="549" y="382" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">JAVA</text>

  <rect x="581" y="368" width="45" height="20" rx="4" fill="rgba(247,37,133,0.15)" stroke="rgba(247,37,133,0.4)"/>
  <text x="603" y="382" fill="#f72585" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">RUST</text>

  <rect x="633" y="368" width="45" height="20" rx="4" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.4)"/>
  <text x="655" y="382" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">GO</text>

  <rect x="685" y="368" width="62" height="20" rx="4" fill="rgba(56,189,248,0.15)" stroke="rgba(56,189,248,0.4)"/>
  <text x="716" y="382" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">+6 MORE</text>

</svg>

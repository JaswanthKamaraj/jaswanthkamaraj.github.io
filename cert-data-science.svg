    </text>

    <!-- Recipient Name -->
    <text x="500" y="245" font-family="'Georgia', serif" font-size="44" font-weight="700" fill="#00274c">
      Jaswanth Kamaraj J
    </text>

    <!-- Gold Accent Line -->
    <line x1="300" y1="265" x2="700" y2="265" stroke="#ffcb05" stroke-width="3.5"/>

    <text x="500" y="315" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" fill="#475569">
      for demonstrated mastery and practical problem solving in
    </text>

    <text x="500" y="360" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="800" fill="#0f172a">
      Applied Data Science with Python
    </text>

    <text x="500" y="405" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13.5" fill="#334155">

  <rect x="35" y="35" width="930" height="630" fill="none" stroke="#ffcb05" stroke-width="2.5"/>
  <rect x="42" y="42" width="916" height="616" fill="none" stroke="#00274c" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- Corner Ornaments -->
  <g fill="#ffcb05">
    <polygon points="45,45 75,45 45,75"/>
    <polygon points="955,45 925,45 955,75"/>
    <polygon points="45,655 75,655 45,625"/>
    <polygon points="955,655 925,655 955,625"/>
  </g>

  <!-- Header Section -->

  <!-- Credential Footer & ID -->
  <g transform="translate(500, 645)" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b">
    <text>
      Credential ID: <tspan fill="#0f172a" font-weight="700">UOM-DS-9382104</tspan> • Issue Date: <tspan fill="#0f172a" font-weight="700">June 2024</tspan> • Verified via Kaggle / Coursera

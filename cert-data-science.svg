    </text>
    <text x="500" y="428" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13.5" fill="#334155">
      Exploratory Statistical Charting with Matplotlib &amp; Seaborn • Relational SQL Querying
    </text>
  </g>

  <!-- Blue & Gold University Seal -->
  <g transform="translate(180, 520)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="48" fill="#00274c"/>
    <circle cx="0" cy="0" r="42" fill="none" stroke="#ffcb05" stroke-width="2.5" stroke-dasharray="4,2"/>
    <text x="0" y="-8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="800" fill="#ffcb05" text-anchor="middle" letter-spacing="1">MICHIGAN</text>
    <text x="0" y="7" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">VERIFIED</text>
    <text x="0" y="21" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#ffcb05" text-anchor="middle">★ DATA SCIENCE ★</text>
    <path d="M -18 36 L -24 64 L 0 54 L 24 64 L 18 36 Z" fill="#ffcb05"/>
  </g>


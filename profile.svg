<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14151b"/>
      <stop offset="50%" stop-color="#0a0a0d"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="32" fill="url(#bgGrad)"/>
  <rect width="396" height="396" x="2" y="2" rx="30" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Ambient Glow Behind Avatar -->
  <circle cx="200" cy="180" r="120" fill="url(#glowGrad)"/>

  <!-- Stylized Person Avatar / Silhouette in Gold -->
  <g fill="url(#goldGrad)">
    <!-- Head -->
    <circle cx="200" cy="155" r="58"/>
    <!-- Shoulders / Torso -->
    <path d="M110 320 C110 240, 145 225, 200 225 C255 225, 290 240, 290 320 Z"/>
  </g>

  <!-- High-tech circuit / AI accent lines -->
  <g stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.5" fill="none">
    <circle cx="320" cy="80" r="4" fill="#ffd700"/>
    <line x1="320" y1="84" x2="320" y2="120"/>
    <line x1="320" y1="120" x2="350" y2="140"/>
    <circle cx="80" cy="300" r="4" fill="#ffd700"/>
    <line x1="80" y1="296" x2="80" y2="260"/>
    <line x1="80" y1="260" x2="60" y2="240"/>
  </g>

  <!-- Badge at bottom -->
  <g transform="translate(130, 340)">
    <rect width="140" height="32" rx="16" fill="#181920" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <text x="70" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#ffd700" text-anchor="middle">JASWANTH K.</text>
  </g>
</svg>
